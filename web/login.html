<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Sign in to Server Hub.">
  <title>Sign in · Server Hub</title>
  <link rel="icon" type="image/png" href="/static/img/logo.png">
  <link rel="preload" href="/static/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/static/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/login.css">
  <script type="module" src="/static/js/login.js"></script>
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card glass">
      <div class="auth-brand">
        <img src="/static/img/logo.png" alt="" width="36" height="36">
        <h1>Server Hub</h1>
      </div>
      <div id="auth-root" class="auth-root">
        <p class="muted auth-loading" role="status">Loading…</p>
      </div>
      <noscript>
        <p class="noscript-msg">Signing in needs JavaScript. Please enable it and reload the page.</p>
      </noscript>
    </div>
  </main>
</body>
</html>
