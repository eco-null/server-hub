name: Docker images

on:
  pull_request:
    paths:
      - '.github/workflows/images.yml'
      - '.dockerignore'
      - 'Dockerfile'
      - 'compose.yaml'
      - 'requirements.lock'
      - 'serverhub/**'
      - 'web/**'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish again (for example v2.2.0); empty only runs the checks
        required: false
        default: ''
      latest:
        description: Also point the latest tag at this image
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Image and recovery (linux/${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.arch == 'arm64'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          tags: server-hub:smoke
          load: true
      - name: Boot, back up and rehearse recovery
        env:
          IMAGE_PLATFORM: linux/${{ matrix.arch }}
          REPUBLISH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          export SERVERHUB_SECRET_KEY="$(openssl rand -hex 24)"
          container=serverhub-smoke
          image=server-hub:smoke
          # v2.2.0 multi-platform index, pinned so a moved tag cannot change the fixture.
          legacy_image=ghcr.io/eco-null/server-hub@sha256:e55af9fda2af8e088d294208b57412b3612598450895c48edfa1ea61ded01db2
          docker volume create serverhub-smoke-data
          opts=(--platform "$IMAGE_PLATFORM" -e SERVERHUB_SECRET_KEY -v serverhub-smoke-data:/data
                --read-only --tmpfs /tmp:size=16m,mode=1777 --cap-drop ALL --security-opt no-new-privileges)
          wait_ready() {
            for attempt in {1..30}; do
              if docker exec "$container" python -m serverhub healthcheck; then return; fi
              sleep 2
            done
            docker logs "$container"
            return 1
          }
          boot() {
            docker run -d --name "$container" "${opts[@]}" "$1"
            wait_ready
          }
          stop_and_remove() {
            docker stop "$container"
            docker rm "$container"
          }
          assert_database() {
            docker exec "$container" python -c '
          import sqlite3
          import sys

          db = sqlite3.connect("file:/data/serverhub.db?mode=ro", uri=True)
          schema = db.execute("PRAGMA user_version").fetchone()[0]
          assert schema == int(sys.argv[1]), schema
          users = db.execute("SELECT username, email, role FROM users").fetchall()
          assert users == [("before", "before@example.org", "admin")], users
          ' "$1"
          }
          assert_backup() {
            docker exec "$container" python -m serverhub verify-backup "$1" \
              | grep -Fx "Verified SQLite backup (schema version $2)"
          }

          # An explicit republish can target a release older than the migration under test.
          baseline="$image"
          if [[ -z "${REPUBLISH_TAG:-}" ]]; then
            docker pull --platform "$IMAGE_PLATFORM" "$legacy_image"
            baseline="$legacy_image"
          fi
          printf '%s\n' 'smoke-test-password' | docker run --rm -i "${opts[@]}" "$baseline" \
            create-admin --email before@example.org --username before --password-stdin
          boot "$baseline"
          if [[ "$baseline" == "$legacy_image" ]]; then
            assert_database 2
            docker exec "$container" python -m serverhub backup /data/pre-upgrade.db
            assert_backup /data/pre-upgrade.db 2
            stop_and_remove
            boot "$image"
          fi
          current_schema=$(docker exec "$container" python -c \
            'from serverhub.db import _migrations; print(len(_migrations()))')
          if [[ "$baseline" == "$legacy_image" ]]; then
            test "$current_schema" -ge 3
          fi
          assert_database "$current_schema"
          docker exec "$container" python -m serverhub backup /data/current-version.db
          assert_backup /data/current-version.db "$current_schema"
          printf '%s\n' 'smoke-test-password' | docker exec -i "$container" python -m serverhub \
            create-admin --email after@example.org --username after --password-stdin
          docker stop "$container"
          docker run --rm "${opts[@]}" "$image" restore /data/current-version.db
          docker start "$container"
          wait_ready
          assert_database "$current_schema"

          if [[ "$baseline" == "$legacy_image" ]]; then
            stop_and_remove
            docker run --rm "${opts[@]}" "$image" restore /data/pre-upgrade.db
            boot "$legacy_image"
            assert_database 2
          fi

  publish:
    name: Publish versioned image to GHCR
    if: github.event_name == 'release' || inputs.tag != ''
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - name: Validate release tag
        id: image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          # A published stable release moves latest; a manual run only when asked.
          LATEST: ${{ (github.event_name == 'release' && !github.event.release.prerelease) || inputs.latest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]]; then
            echo "Use a version tag such as v2.1.0 or v2.1.0-rc.1" >&2
            exit 1
          fi
          image="ghcr.io/${REPOSITORY,,}"
          tags="$image:$RELEASE_TAG"
          if [[ "$LATEST" == true && "$RELEASE_TAG" != *-* ]]; then tags="$tags,$image:latest"; fi
          printf 'tags=%s\nversion=%s\n' "$tags" "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
