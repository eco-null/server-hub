name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 = Dockerfile base image; 3.12 = minimum from pyproject requires-python (>=3.12).
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install dev dependencies
        run: |
          set -euo pipefail
          pip install --require-hashes --no-deps -r requirements-dev.lock

      - name: Lint and format check
        run: |
          set -euo pipefail
          ruff check .
          ruff format --check .

      - name: Tests
        run: |
          set -euo pipefail
          python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Frontend tests
        working-directory: web
        run: |
          set -euo pipefail
          node --version
          npm test

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Demo tests
        working-directory: demo
        run: |
          set -euo pipefail
          node --version
          npm test

      - name: Build demo
        run: |
          set -euo pipefail
          node demo/build.js --base /server-hub/ --out demo/dist

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create .env with a generated secret key and setup token
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 24)"
          token="$(openssl rand -hex 16)"
          test "${#secret}" -eq 48
          cp .env.example .env
          sed -i "s|^SERVERHUB_SECRET_KEY=.*|SERVERHUB_SECRET_KEY=${secret}|" .env
          echo "SERVERHUB_SETUP_TOKEN=${token}" >> .env
          echo "SETUP_TOKEN=${token}" >> "$GITHUB_ENV"
          test "$(grep -c '^SERVERHUB_SECRET_KEY=' .env)" -eq 1
          test "$(grep -c '^SERVERHUB_SETUP_TOKEN=' .env)" -eq 1

      - name: Validate compose file
        run: |
          set -euo pipefail
          docker compose config -q

      - name: Build and start
        run: |
          set -euo pipefail
          docker compose up -d --build

      - name: Wait for /healthz on port 8642
        run: |
          set -euo pipefail
          for _ in $(seq 1 45); do
            if curl -fsS http://localhost:8642/healthz; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for /healthz" >&2
          exit 1

      - name: Wait for container health status
        run: |
          set -euo pipefail
          cid="$(docker compose ps -q server-hub)"
          test -n "$cid"
          status=""
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$cid")"
            case "$status" in
              healthy)
                echo "Container is healthy"
                exit 0
                ;;
              unhealthy)
                echo "Container reported unhealthy" >&2
                exit 1
                ;;
            esac
            sleep 2
          done
          echo "Timed out; last health status: $status" >&2
          exit 1

      - name: Smoke test
        run: |
          set -euo pipefail
          base="http://localhost:8642"
          jar="$RUNNER_TEMP/cookies.txt"
          headers="$RUNNER_TEMP/headers.txt"
          expect_status() {
            if [ "$2" != "$3" ]; then
              echo "$1: expected HTTP $3, got $2" >&2
              exit 1
            fi
          }

          state="$(curl -fsS "$base/api/auth/state")"
          echo "$state"
          grep -Eq '"setup_required"[[:space:]]*:[[:space:]]*true' <<<"$state"

          # Without the right setup token the first-run setup is refused.
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' -H 'X-ServerHub-Client: ci' \
            -d '{"email":"admin@example.com","username":"admin","password":"ci-Test-Passw0rd-2026","setup_token":"wrong-token-0000"}' \
            "$base/api/auth/setup")"
          expect_status "POST /api/auth/setup (wrong token)" "$code" 403

          # A Host that is not allowlisted is refused (DNS rebinding defence).
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: evil.example' "$base/healthz")"
          expect_status "GET /healthz (foreign Host)" "$code" 400

          body="$(printf '{"email":"admin@example.com","username":"admin","password":"ci-Test-Passw0rd-2026","setup_token":"%s"}' "$SETUP_TOKEN")"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -c "$jar" -b "$jar" \
            -H 'Content-Type: application/json' -H "Origin: $base" -H 'X-ServerHub-Client: ci' \
            -d "$body" "$base/api/auth/setup")"
          expect_status "POST /api/auth/setup" "$code" 200

          # A cookie-bearing state change without Origin / Sec-Fetch-Site needs X-ServerHub-Client.
          code="$(curl -sS -o /dev/null -w '%{http_code}' -b "$jar" \
            -H 'Content-Type: application/json' -d '{"name":"x","url":"http://x.lan"}' \
            "$base/api/services")"
          expect_status "POST /api/services (cookie, no client header)" "$code" 403
          code="$(curl -sS -o /dev/null -w '%{http_code}' -b "$jar" \
            -H 'Content-Type: application/json' -H 'X-ServerHub-Client: ci' \
            -d '{"name":"x","url":"http://x.lan"}' "$base/api/services")"
          expect_status "POST /api/services" "$code" 201

          code="$(curl -sS -o /dev/null -w '%{http_code}' -b "$jar" "$base/api/bootstrap")"
          expect_status "GET /api/bootstrap (with session)" "$code" 200

          code="$(curl -sS -o /dev/null -w '%{http_code}' "$base/")"
          expect_status "GET / (no session)" "$code" 302

          curl -sS -D "$headers" -o /dev/null "$base/login"
          if ! grep -qi '^content-security-policy:' "$headers"; then
            echo "GET /login: missing content-security-policy header" >&2
            cat "$headers" >&2
            exit 1
          fi

      # ---- Phase 2: Docker auto-discovery through the read-only socket proxy ----

      - name: "Discovery: validate the profile's compose configuration"
        run: |
          set -euo pipefail
          cfg="$(COMPOSE_PROFILES=docker docker compose config --format json)"
          # The socket is mounted read-only into the proxy, and into nothing else.
          jq -e '.services["docker-proxy"].volumes[]
                 | select(.target == "/var/run/docker.sock") | .read_only == true' <<<"$cfg"
          jq -e '[.services["server-hub"].volumes[]? | select(.target == "/var/run/docker.sock")]
                 | length == 0' <<<"$cfg"
          # Only container listing is allowed; writes are off.
          jq -e '.services["docker-proxy"].environment
                 | .CONTAINERS == "1" and .POST == "0" and .EXEC == "0" and .IMAGES == "0"' <<<"$cfg"
          jq -e '.networks["docker-proxy"].internal == true' <<<"$cfg"
          jq -e '.services["docker-proxy"].ports == null' <<<"$cfg"

      - name: "Discovery: enable the profile and restart"
        run: |
          set -euo pipefail
          {
            echo "COMPOSE_PROFILES=docker"
            echo "SERVERHUB_DOCKER_HOST=tcp://docker-proxy:2375"
            echo "SERVERHUB_DOCKER_PUBLIC_HOST=localhost"
          } >> .env
          docker compose up -d
          for _ in $(seq 1 45); do
            if curl -fsS http://localhost:8642/healthz; then echo; exit 0; fi
            sleep 2
          done
          echo "Timed out waiting for /healthz after enabling discovery" >&2
          exit 1

      - name: "Discovery: start test containers"
        run: |
          set -euo pipefail
          docker run -d --name sh-ci-labelled \
            --label serverhub.enable=true \
            --label "serverhub.name=CI Labelled" \
            --label serverhub.url=http://example.com \
            busybox:1.37 sleep 600
          docker run -d --name sh-ci-web -p 18080:80 busybox:1.37 httpd -f -p 80

      - name: "Discovery: API assertions"
        run: |
          set -euo pipefail
          base="http://localhost:8642"
          jar="$RUNNER_TEMP/cookies-discovery.txt"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -c "$jar" -b "$jar" \
            -H 'Content-Type: application/json' -H 'X-ServerHub-Client: ci' \
            -d '{"identifier":"admin","password":"ci-Test-Passw0rd-2026"}' "$base/api/auth/login")"
          test "$code" = 200

          boot="$(curl -fsS -b "$jar" "$base/api/bootstrap")"
          jq -e '.docker.enabled == true' <<<"$boot"

          # The container list is cached for a few seconds; poll until it shows up.
          ok=""
          for _ in $(seq 1 20); do
            docker_json="$(curl -fsS -b "$jar" "$base/api/docker")"
            if jq -e '.enabled == true and .available == true and any(.services[];
                  .id == "docker:sh-ci-labelled" and .name == "CI Labelled"
                  and .url == "http://example.com" and .container.state == "running")' \
                <<<"$docker_json" >/dev/null; then
              ok=1; break
            fi
            sleep 2
          done
          echo "$docker_json" | jq .
          test -n "$ok"

          sugg="$(curl -fsS -b "$jar" "$base/api/admin/docker/suggestions")"
          echo "$sugg" | jq .
          jq -e '.available == true' <<<"$sugg"
          jq -e 'any(.suggestions[]; .container.name == "sh-ci-web"
                 and .suggested.url == "http://localhost:18080")' <<<"$sugg"
          # Neither Server Hub itself nor the labelled container is suggested.
          jq -e 'all(.suggestions[]; .container.name != "server-hub"
                 and .container.name != "sh-ci-labelled")' <<<"$sugg"

      - name: "Discovery: the proxy refuses writes and other API sections"
        run: |
          set -euo pipefail
          net="$(docker network ls -q --filter label=com.docker.compose.network=docker-proxy)"
          test -n "$net"
          probe() {
            docker run --rm --network "$net" curlimages/curl:8.11.1 \
              -sS -o /dev/null -w '%{http_code}' "$@"
          }
          code="$(probe http://docker-proxy:2375/containers/json)"
          echo "GET /containers/json -> $code"; test "$code" = 200
          code="$(probe -X POST -H 'Content-Type: application/json' -d '{"Image":"busybox:1.37"}' \
            http://docker-proxy:2375/containers/create)"
          echo "POST /containers/create -> $code"; test "$code" = 403
          code="$(probe -X POST http://docker-proxy:2375/containers/sh-ci-web/stop)"
          echo "POST /containers/{id}/stop -> $code"; test "$code" = 403
          code="$(probe http://docker-proxy:2375/images/json)"
          echo "GET /images/json -> $code"; test "$code" = 403
          # The internal network has no route out.
          if docker run --rm --network "$net" curlimages/curl:8.11.1 -sS -m 5 -o /dev/null \
              http://example.com; then
            echo "internal network reached the internet" >&2
            exit 1
          fi
          test "$(docker ps -q -f name=^sh-ci-web$ | wc -l)" -eq 1

      - name: Print compose logs on failure
        if: failure()
        run: |
          COMPOSE_PROFILES=docker docker compose logs --no-color
          docker logs sh-ci-labelled || true
          docker logs sh-ci-web || true

      - name: Tear down
        if: always()
        run: |
          docker rm -f sh-ci-labelled sh-ci-web || true
          COMPOSE_PROFILES=docker docker compose down -v
