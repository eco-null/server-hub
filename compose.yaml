# Server Hub: one container, no reverse proxy. Configure it in .env
# (copy .env.example to .env and set SERVERHUB_SECRET_KEY first).
#
# First run: the startup log prints a one-time setup token, which the web UI
# asks for when you create the admin account:
#   docker compose logs server-hub | grep -A1 "SETUP TOKEN"
# (or set SERVERHUB_SETUP_TOKEN in .env to choose it yourself).
#
# The app is exposed directly. Without TLS it serves plain HTTP: fine on a
# trusted LAN / VPN / behind an HTTPS tunnel, otherwise enable TLS below.
services:
  server-hub:
    build: .
    image: server-hub:latest
    container_name: server-hub
    restart: unless-stopped
    env_file: .env
    environment:
      # Fixed inside the container; change the published port below instead.
      SERVERHUB_DATA_DIR: /data
      SERVERHUB_HOST: 0.0.0.0
      SERVERHUB_PORT: "8642"
    ports:
      - "${SERVERHUB_PUBLISH_PORT:-8642}:8642"
    volumes:
      # Named volume (recommended). If you use a bind mount instead, e.g.
      # ./data:/data, the host directory must be owned by uid 10001
      # (sudo chown -R 10001:10001 ./data): the app runs as that user and the
      # root filesystem is read-only, so it cannot fix permissions itself.
      - server-hub-data:/data
      # TLS without a reverse proxy: mount a certificate + private key (PEM)
      # read-only and set in .env:
      #   SERVERHUB_TLS_CERT_FILE=/certs/fullchain.pem
      #   SERVERHUB_TLS_KEY_FILE=/certs/privkey.pem
      #   SERVERHUB_PUBLIC_URL=https://hub.example.org:8642
      # The key file must be readable by uid 10001.
      # - ./certs:/certs:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 20s

volumes:
  server-hub-data:
